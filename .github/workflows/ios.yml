name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check game rules, replay state and hidden information
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swiftc -O SignalGrid/Game.swift SignalGrid/Opponent.swift Tests/GameChecks.swift \
            -o "$RUNNER_TEMP/game-checks"
          "$RUNNER_TEMP/game-checks"

      - name: Compile iOS device app and verify unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -project SignalGrid.xcodeproj -scheme SignalGrid -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/SignalGridBuild" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/SignalGridBuild/Build/Products/Release-iphoneos/SignalGrid.app"
          test -x "$app/SignalGrid"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$app/Info.plist")" = APPL
          xcrun vtool -show-build "$app/SignalGrid" | grep -Eq 'platform[[:space:]]+IOS$'
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/SignalGrid.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" dist/SignalGrid-unsigned.ipa
          unzip -tq dist/SignalGrid-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SignalGrid-unsigned-ipa
          path: dist/SignalGrid-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Launch on an iPhone simulator
        run: |
          set -euo pipefail
          xcodebuild -project SignalGrid.xcodeproj -scheme SignalGrid -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/SignalGridBuild" \
            CODE_SIGNING_ALLOWED=NO build
          xcrun simctl list devices available -j > "$RUNNER_TEMP/SignalGridSimulators.json"
          device="$(python3 - "$RUNNER_TEMP/SignalGridSimulators.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as source:
              devices = json.load(source)["devices"]
          print(next(device["udid"] for runtime in reversed(list(devices))
                     if ".iOS-" in runtime for device in devices[runtime]
                     if device.get("isAvailable") and device["name"].startswith("iPhone")))
          PY
          )"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl bootstatus "$device" -b
          app="$RUNNER_TEMP/SignalGridBuild/Build/Products/Release-iphonesimulator/SignalGrid.app"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
